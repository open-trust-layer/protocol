[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-layer-protocol"
version = "0.0.2.dev0"
description = "Open Layer Protocol reference implementation and executable conformance harness"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Open Trust Foundation"}]
dependencies = [
  "cryptography>=41.0",
]

[project.scripts]
olp-conformance = "olp_conformance.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
