name: OLP v1 candidate readiness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap-candidate-measurements:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run repository tests
        run: python -m pytest -q

      - name: Measure pinned stabilization artifacts
        run: |
          sha256sum \
            docs/v1-threat-model.md \
            stabilization/v1-review-register.json \
            docs/v1-release-process.md | tee m26-artifact-digests.txt

      - name: Measure mandatory core corpus commitment
        run: |
          olp-conformance commitment --profile core-v1 --json > v1-core-candidate-commitment.json
          python - <<'PY'
          import json
          value = json.load(open("v1-core-candidate-commitment.json", encoding="utf-8"))
          print("core-v1 corpus SHA-256:", value["commitment"]["digest_hex"])
          print("core-v1 cases:", len(value["case_ids"]))
          print("core-v1 capabilities:", len(value["capabilities"]))
          PY

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m26-bootstrap-candidate-measurements
          path: |
            m26-artifact-digests.txt
            v1-core-candidate-commitment.json
          if-no-files-found: error
