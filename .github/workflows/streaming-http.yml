name: OLP streaming HTTP conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-streaming-http:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Run streaming-http-v1 corpus
        run: olp-conformance run --profile streaming-http-v1 --quiet --report conformance-streaming-http.json
      - name: Assert Milestone 24 case count
        run: |
          python - <<'PY'
          import json
          report = json.load(open("conformance-streaming-http.json", encoding="utf-8"))
          results = report["results"]
          assert len(results) == 36, f"expected 36 streaming-http-v1 cases, got {len(results)}"
          failed = [item for item in results if item["status"] != "PASS"]
          assert not failed, failed
          print("Python streaming-http-v1 conformance: 36/36 PASS")
          PY
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: streaming-http-python-${{ matrix.python-version }}
          path: conformance-streaming-http.json
          if-no-files-found: error

  rust-streaming-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: python -m pip install -e '.[test]'
      - run: cargo test --locked --manifest-path implementations/rust/Cargo.toml
      - run: cargo build --release --locked --manifest-path implementations/rust/Cargo.toml
      - name: Run independent Rust against streaming-http-v1 corpus
        run: |
          olp-conformance run \
            --profile streaming-http-v1 \
            --adapter subprocess \
            --adapter-command implementations/rust/target/release/olp-conformance-adapter \
            --quiet \
            --report conformance-rust-streaming-http.json
      - name: Assert Milestone 24 case count
        run: |
          python - <<'PY'
          import json
          report = json.load(open("conformance-rust-streaming-http.json", encoding="utf-8"))
          results = report["results"]
          assert len(results) == 36, f"expected 36 streaming-http-v1 cases, got {len(results)}"
          failed = [item for item in results if item["status"] != "PASS"]
          assert not failed, failed
          print("Rust streaming-http-v1 conformance: 36/36 PASS")
          PY
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: streaming-http-rust-1.85.0
          path: conformance-rust-streaming-http.json
          if-no-files-found: error
